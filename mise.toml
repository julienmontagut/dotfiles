# Tools for working on this repo. The machine itself is defined in config/mise/config.toml,
# symlinked to ~/.config/mise, so `mise bootstrap` sets a machine up from any directory.

[tools]
lua = "latest"
lua-language-server = "latest"
stylua = "latest"
shfmt = "latest"
taplo = "latest"
"cargo:nickel-lang-cli" = "latest"

# Seed only. On a fresh machine the global config doesn't exist yet, so install.sh runs
# `mise bootstrap --only dotfiles` here first to create it; the full bootstrap then reads it.
[dotfiles]
"~/.config/mise" = { source = "config/mise", mode = "symlink-each" }
