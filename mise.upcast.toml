# Upcast layer - only applied with MISE_ENV=upcast.
#
# Skills that drive Upcast's own infrastructure and SaaS. They are useless
# without Upcast credentials and have no business on a client machine, so they
# are kept out of the base config and linked only on machines that opt in:
#
#   MISE_ENV=upcast mise bootstrap
#
# `symlink-each` recurses to leaf files, so this merges into the ~/.claude/skills
# tree created by the base `~/.claude` entry instead of replacing it. Note that
# mise never prunes: dropping MISE_ENV stops linking new skills but leaves any
# already-linked ones in place, so remove those by hand when de-provisioning.

[dotfiles]
"~/.claude/skills" = { source = "claude-upcast/skills", mode = "symlink-each" }
