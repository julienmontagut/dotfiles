# Fuzzel configuration
# Application launcher for Wayland
# See: man fuzzel.ini
#
# Shaped to match the waybar pills and mako's cards: same surface, same 12px radius, same
# hairline. The iris accent is the one thing that stands out, and it stands out in the same two
# places waybar uses it - the selected row and the matched characters.

[main]
font=Lilex Nerd Font Mono:size=16
layer=overlay
lines=12
width=40
horizontal-pad=20
vertical-pad=12
inner-pad=14
line-height=28

[colors]
background=1f1d2ef7
text=e0def4ff
match=c4a7e7ff
selection=403d52ff
selection-text=e0def4ff
selection-match=c4a7e7ff
border=403d52ff

