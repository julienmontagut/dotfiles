# Fuzzel configuration
# Application launcher for Wayland
# See: man fuzzel.ini

[main]
font=Lilex Nerd Font:size=14
# terminal= is passed by sway/config as --terminal: it resolves ghostty-or-foot through a
# shell substitution, and fuzzel.ini has no shell to run one in.
layer=overlay

[colors]
# Rosé Pine. Fuzzel cannot follow the OS appearance, so it stays dark.
background=191724ff
text=e0def4ff
match=c4a7e7ff
selection=403d52ff
selection-text=e0def4ff
selection-match=c4a7e7ff
border=c4a7e7ff

# Basalt Dark
# background=0e0e0eff
# text=e7e5e5ff
# match=7ca2d8ff
# selection=3e3e44ff
# selection-text=e7e5e5ff
# selection-match=7ca2d8ff
# border=7ca2d8ff

[border]
width=2
radius=8
