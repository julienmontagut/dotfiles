# Foot configuration
# The Linux terminal, referenced as $term in sway/config and terminal= in fuzzel.ini.
# See: man 5 foot.ini

[main]
font=Lilex Nerd Font Mono:size=12

# foot's own terminfo is not installed on most remote hosts, and unlike ghostty it has no
# ssh-terminfo shell integration to push it. Same trade the alacritty config makes.
term=xterm-256color

# Point sizes render large under `output eDP-1 scale 2`, so 12 here sits where 16 does on
# an unscaled output.
#
# dpi-aware=no (the default) makes foot scale the font by the compositor's output scale,
# which is what sway/config's `output eDP-1 scale 2` wants. Do not set it to yes.

[colors]
alpha=0.95

# Rosé Pine. foot has no light/dark switch, so swap in the Dawn block below by hand.
background=191724
foreground=e0def4
regular0=26233a
regular1=eb6f92
regular2=31748f
regular3=f6c177
regular4=9ccfd8
regular5=c4a7e7
regular6=ebbcba
regular7=e0def4
bright0=6e6a86
bright1=eb6f92
bright2=31748f
bright3=f6c177
bright4=9ccfd8
bright5=c4a7e7
bright6=ebbcba
bright7=e0def4

