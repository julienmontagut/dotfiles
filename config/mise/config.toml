# The machine definition. ~/.config/mise is a symlink to this directory (see [dotfiles] in the
# repo's mise.toml), so `mise bootstrap` converges a whole machine from any directory. Per-OS
# packages and settings are in config.macos.toml / config.linux.toml, loaded by auto_env (see
# miserc.toml).
#
# Dotfile sources are relative and climb out through that symlink: mise joins them onto
# ~/.config/mise textually, and the kernel resolves the symlink before applying "..", so "../nvim"
# lands in <checkout>/config/nvim wherever the repo was cloned. Hence one symlink, not a fixed
# path - and moving the checkout only needs ~/.config/mise re-pointed, since every other link
# routes through it. Templating is not an option here: mise does not render {{ }} in dotfile
# sources (verified - config_root, env and vars all come through literal).
#
# Deliberately not a [bootstrap.repos] entry - that aborts the whole bootstrap whenever the
# checkout is dirty, which for a dotfiles repo is most of the time.

# A floor, not a pin: older mise aborts the packages step on the OrbStack cask (jdx/mise#11472).
min_version = "2026.7.17"

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["dotnet", "opentofu", "rust"]
dotfiles.default_mode = "symlink"

[settings.github]
use_git_credentials = true

[bootstrap.user]
login_shell = "/bin/zsh"

[tools]
bat = "latest"
bitwarden = "latest"
claude-code = "latest"
dua = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
herdr = "latest"
jj = "latest"
jq = "latest"
just = "latest"
lazygit = "latest"
mprocs = "latest"
neovim = "latest"
ripgrep = "latest"
scaleway = "latest"
starship = "latest"
tmux = "latest"
tree-sitter = "latest"
xh = "latest"
zig = "latest"
zls = "latest"
zellij = "latest"
zoxide = "latest"

# Required tools to install dependencies
rust = "latest"
cargo-binstall = "latest"

# CLI tools out of the registry
"cargo:bacon" = "latest"
"cargo:forgejo-cli" = "latest"
"aqua:maaslalani/slides" = "latest"

# The Roslyn LSP, picked up from PATH by roslyn.nvim. Pinned rather than "latest":
# every published version is prerelease-tagged and mise's dotnet backend filters
# prereleases out of "latest", so bumping is a deliberate edit - check
# `mise ls-remote dotnet:roslyn-language-server`.
"dotnet:roslyn-language-server" = "5.11.0-1.26380.4"

# Portable across both OSes. The macOS-only and Linux-only entries are linked everywhere: an
# inert config file on the wrong OS costs nothing, and pruning it would cost a per-OS split.
[dotfiles]
# My Claude layer. ~/.claude is what bare `claude` uses; the client account (~/.claude-igor,
# reached through bin/igor) gets its skills from plugins or local-only config, so none of my
# tooling or credentials leak onto a client's bill.
"~/.claude" = { source = "../../claude", mode = "symlink-each" }
# The one exception: how I work is mine, not the client's. Linked as a single file rather than
# extending the layer above, so ~/.claude-igor stays Claude Code's own directory.
"~/.claude-igor/CLAUDE.md" = "../../claude/CLAUDE.md"
# The Upcast-infrastructure skills. Unconditional, because ~/.claude is the Upcast account by
# definition - the account split does the isolating that MISE_ENV=upcast used to. `symlink-each`
# merges into the ~/.claude tree rather than replacing it, so this entry must follow the one above.
"~/.claude/skills" = { source = "../../claude-upcast/skills", mode = "symlink-each" }
"~/.config/alacritty" = "../alacritty"
"~/.config/ghostty" = "../ghostty"
"~/.config/git" = { source = "../git", mode = "symlink-each" }
"~/.config/ideavim" = "../ideavim"
"~/.config/nvim" = "../nvim"
"~/.config/tmux" = { source = "../tmux", mode = "symlink-each" }
"~/.config/wezterm" = "../wezterm"
"~/.config/zed" = { source = "../zed", mode = "symlink-each" }
"~/.config/zellij/config.kdl" = "../zellij/config.kdl"
"~/.config/zsh" = "../zsh"
"~/.local/bin" = { source = "../../bin", mode = "symlink-each" }
"~/.zshenv" = "../../zshenv"
"~/.zshrc" = "../../zshrc"
# macOS
"~/.config/aerospace" = "../aerospace"
"~/.config/borders" = "../borders"
"~/.config/karabiner" = { source = "../karabiner", mode = "symlink-each" }
"~/.config/sketchybar" = "../sketchybar"
# Linux
"~/.config/fuzzel" = "../fuzzel"
"~/.config/kanshi" = "../kanshi"
"~/.config/keyd" = "../keyd"
"~/.config/sway" = "../sway"
"~/.config/waybar" = "../waybar"
# ~/.config/mise itself is deliberately absent: the repo's mise.toml seeds it, and declaring it
# here would mean a source relative to the very symlink being replaced.

# The zsh plugin manager (zimfw) self-installs on the first interactive shell; see the zim block
# in ./zshrc. No bootstrap task is needed for it.

# Last step of `mise bootstrap`: the macOS bits that aren't declarative - the Brewfile
# (trusted-tap formulae/casks and Mac App Store apps) and macos-setup.sh (Dock, hotkeys, TouchID).
[tasks.bootstrap]
description = "macOS-only: Brewfile and the non-declarative defaults/services"
run = '''
if [ "$(uname)" = Darwin ]; then
  brew bundle --file ~/.config/mise/../../Brewfile
  ~/.config/mise/../../scripts/macos-setup.sh
fi
'''
