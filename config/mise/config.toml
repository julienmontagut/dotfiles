min_version = "2026.7.17"

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["dotnet", "opentofu", "rust"]
dotfiles.default_mode = "symlink"

[settings.github]
use_git_credentials = true

[bootstrap.user]
login_shell = "/bin/zsh"

[tools]
bat = "latest"
bitwarden = "latest"
claude-code = "latest"
dua = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
herdr = "latest"
jj = "latest"
jq = "latest"
just = "latest"
lazygit = "latest"
mprocs = "latest"
neovim = "latest"
ripgrep = "latest"
scaleway = "latest"
starship = "latest"
tmux = "latest"
tree-sitter = "latest"
xh = "latest"
zellij = "latest"
zig = "latest"
zls = "latest"
zoxide = "latest"

# Dependencies to install other packages
rust = "latest"
cargo-binstall = "latest"
dotnet = "latest"

"cargo:bacon" = "latest"
"cargo:forgejo-cli" = "latest"
"aqua:maaslalani/slides" = "latest"

# "latest" resolves to nothing: every release is prerelease-tagged and the dotnet backend filters
# those out. Bump from `mise ls-remote dotnet:roslyn-language-server`.
"dotnet:roslyn-language-server" = "5.11.0-1.26380.4"

[dotfiles]
"~/.claude" = { source = "../../claude", mode = "symlink-each" }
"~/.claude-igor/CLAUDE.md" = "../../claude/CLAUDE.md"
# Must follow ~/.claude: symlink-each merges into that tree instead of replacing it.
"~/.claude/skills" = { source = "../../claude-upcast/skills", mode = "symlink-each" }
"~/.config/alacritty" = "../alacritty"
"~/.config/ghostty" = "../ghostty"
"~/.config/git" = { source = "../git", mode = "symlink-each" }
# A single file: ~/.config/herdr also holds herdr's sockets, logs and session state.
"~/.config/herdr/config.toml" = "../herdr/config.toml"
"~/.config/ideavim" = "../ideavim"
"~/.config/nvim" = "../nvim"
"~/.config/tmux" = { source = "../tmux", mode = "symlink-each" }
"~/.config/wezterm" = "../wezterm"
"~/.config/zed" = { source = "../zed", mode = "symlink-each" }
"~/.config/zellij/config.kdl" = "../zellij/config.kdl"
"~/.config/zsh" = "../zsh"
"~/.local/bin" = { source = "../../bin", mode = "symlink-each" }
"~/.zshenv" = "../../zshenv"
"~/.zshrc" = "../../zshrc"
# macOS
"~/.config/aerospace" = "../aerospace"
"~/.config/borders" = "../borders"
"~/.config/karabiner" = { source = "../karabiner", mode = "symlink-each" }
"~/.config/sketchybar" = "../sketchybar"
# Linux
"~/.config/foot" = "../foot"
"~/.config/fuzzel" = "../fuzzel"
"~/.config/kanshi" = "../kanshi"
"~/.config/sway" = "../sway"
"~/.config/waybar" = "../waybar"
# ~/.config/mise is absent on purpose: its source would be relative to the symlink being replaced.
# The repo's mise.toml seeds it instead.

[tasks.bootstrap]
description = "macOS-only: Brewfile and the non-declarative defaults/services"
# cd -P: unlike mise's dotfile sources, the shell resolves `..` lexically, so the climb out of
# the ~/.config/mise symlink only reaches the checkout physically.
run = '''
if [ "$(uname)" = Darwin ]; then
  cd -P ~/.config/mise/../..
  brew bundle --file Brewfile
  scripts/macos-setup.sh
fi
'''
