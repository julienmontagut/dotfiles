# The Wayland desktop stack is not here, it is in bin/install-sway.
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:fontconfig" = "latest"
"apt:libssl-dev" = "latest"
"apt:pkg-config" = "latest"
"apt:xclip" = "latest"
"apt:zsh" = "latest"

[tools]
"github:ryanoasis/nerd-fonts" = { version = "3.4.0", asset_pattern = "Lilex.zip", postinstall = "mkdir -p ~/.local/share/fonts && cp \"$MISE_TOOL_INSTALL_PATH\"/*.ttf ~/.local/share/fonts/ && fc-cache -f ~/.local/share/fonts" }
