<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font rendering. GNOME keeps these in org.gnome.desktop.interface and gnome-settings-daemon
  pushes them to every toolkit over XSETTINGS. Sway runs no settings daemon, so anything that
  asks the desktop (Chrome, GTK) is answered by nobody and falls back to fontconfig's defaults.
  Ubuntu's default is rgba=rgb - subpixel antialiasing - which on a 220dpi panel is invisible
  and on a 100dpi external puts an orange fringe down the left of every stem and a blue one
  down the right.

  So the settings live here instead, where every toolkit reads them and no daemon is needed.
  The values are GNOME's own, kept in step with:

    gsettings get org.gnome.desktop.interface font-antialiasing   # grayscale
    gsettings get org.gnome.desktop.interface font-hinting        # slight

  hintslight is deliberate: full hinting snaps stems to the pixel grid and distorts the
  letterforms, which is a bad trade at 100dpi and a pointless one at 220.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
