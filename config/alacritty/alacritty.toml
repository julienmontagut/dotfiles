[shell]
program = "/usr/bin/env"
args = [
  "zsh",
  "-l",
  "-c",
  "command -v tx >/dev/null 2>&1 && exec tx || exec zsh -l",
]

[env]
TERM = "xterm-256color"

[font]
size = 16

[font.normal]
family = "Lilex Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Lilex Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Lilex Nerd Font Mono"
style = "Italic"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
opacity = 0.95

[scrolling]
history = 10000

# Rosé Pine. Alacritty has no light/dark switch, so swap in the Dawn block below by hand.
[colors.primary]
background = "#191724"
foreground = "#e0def4"

[colors.selection]
background = "#403d52"
text = "#e0def4"

[colors.normal]
black = "#26233a"
red = "#eb6f92"
green = "#31748f"
yellow = "#f6c177"
blue = "#9ccfd8"
magenta = "#c4a7e7"
cyan = "#ebbcba"
white = "#e0def4"

[colors.bright]
black = "#6e6a86"
red = "#eb6f92"
green = "#31748f"
yellow = "#f6c177"
blue = "#9ccfd8"
magenta = "#c4a7e7"
cyan = "#ebbcba"
white = "#e0def4"

