# AeroSpace tiling window manager configuration
# See: https://nikitabobko.github.io/AeroSpace/guide
config-version = 2

# Start at login
start-at-login = false

# Default layout: fullscreen (accordion with no peek padding)
default-root-container-layout = 'accordion'
accordion-padding = 16

# Keyboard layout preset for Dvorak
key-mapping.preset = "dvorak"

# Mouse / focus coupling: the pointer is pulled across on a monitor change but never to a window
# centre.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Keep sketchybar's workspace indicators in sync. Without this the bar only ever updates when
# clicked, since aerospace emits no event sketchybar can subscribe to on its own.
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Gaps configuration
[gaps]
# outer.top reserves the sketchybar strip, and how much depends on the display. aerospace measures
# gaps from the *visible* frame, and macOS reserves a different amount per display:
#   built-in : the notch band is already excluded from the visible frame, and the 32pt bar sits
#              inside it, so a plain 8pt gap is all that's needed.
#   external : nothing is reserved (the menu bar is auto-hidden, _HIHideMenuBar = 1), so the frame
#              starts at y=0 and the gap has to cover the bar itself: 32 (bar height) + 8 = 40.
# One shared value of 8 puts external windows at y=8, tiling them under the bar by 24pt.
# Monitor patterns are unanchored case-insensitive matches on the monitor name, so 'built-in'
# catches "Built-in Retina Display" and "Built-in Liquid Retina XDR Display" alike. Keep the two
# numbers in step with --bar height in config/sketchybar/sketchybarrc.
outer.top = [{ monitor.'built-in' = 8 }, 40]
outer.bottom = 8
outer.left = 8
outer.right = 8
inner.vertical = 8
inner.horizontal = 8

# =============================================================================
# Window rules
# Apps have no home workspace - a new window opens on the workspace you are already on, which is
# aerospace's default once nothing overrides it. The only rules left set a layout, not a location.
# =============================================================================

# --- games: float rather than tile ---
[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.codeweavers.CrossOver'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Chess'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Civilization'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Cities Skylines'
run = 'layout floating'

# =============================================================================
# Main mode bindings
# =============================================================================

[mode.main.binding]
# Workspace switching (hyper + position). Five, fixed, anonymous, and the same five sway has - the
# digit is the workspace, which is exactly what the bar draws. Nothing else gets a workspace
# shortcut.
cmd-ctrl-alt-1 = "workspace 1"
cmd-ctrl-alt-2 = "workspace 2"
cmd-ctrl-alt-3 = "workspace 3"
cmd-ctrl-alt-4 = "workspace 4"
cmd-ctrl-alt-5 = "workspace 5"

# Move focused window to workspace (hyper + shift + position). --focus-follows-window goes with
# it: throwing a window somewhere means you meant to go there too, not to keep staring at the gap
# it left. Built-in flag, so no chained command list.
cmd-ctrl-alt-shift-1 = "move-node-to-workspace --focus-follows-window 1"
cmd-ctrl-alt-shift-2 = "move-node-to-workspace --focus-follows-window 2"
cmd-ctrl-alt-shift-3 = "move-node-to-workspace --focus-follows-window 3"
cmd-ctrl-alt-shift-4 = "move-node-to-workspace --focus-follows-window 4"
cmd-ctrl-alt-shift-5 = "move-node-to-workspace --focus-follows-window 5"

# Focus navigation (vim-style)
cmd-ctrl-alt-h = "focus left"
cmd-ctrl-alt-j = "focus down"
cmd-ctrl-alt-k = "focus up"
cmd-ctrl-alt-l = "focus right"

# Move window (vim-style)
cmd-ctrl-alt-shift-h = "move left"
cmd-ctrl-alt-shift-j = "move down"
cmd-ctrl-alt-shift-k = "move up"
cmd-ctrl-alt-shift-l = "move right"

# Layout, bound directly rather than behind a mode - same keys sway uses for the same actions.
cmd-ctrl-alt-s = "layout tiles horizontal"          # splith
cmd-ctrl-alt-v = "layout tiles vertical"            # splitv
cmd-ctrl-alt-t = "layout accordion horizontal"      # tabbed
cmd-ctrl-alt-e = "layout tiles horizontal vertical" # toggle split orientation
cmd-ctrl-alt-f = "fullscreen"
cmd-ctrl-alt-w = "layout floating tiling"           # floating toggle
cmd-ctrl-alt-0 = "balance-sizes"

# Resize is the one thing that stays a mode, because it is the one thing you repeat. Sway keeps
# exactly this mode and no other; so do we.
cmd-ctrl-alt-r = "mode resize"

# Scratch. aerospace has no scratchpad, so it is a sixth workspace that no digit reaches - drawn on
# the bar as `-` and reachable only here, which is what sway's scratchpad amounts to in practice.
# It keeps the id `scratch` because aerospace refuses a name starting with a dash.
cmd-ctrl-alt-minus = "workspace scratch"
cmd-ctrl-alt-shift-minus = "move-node-to-workspace --focus-follows-window scratch"

# Window management
cmd-ctrl-alt-shift-q = "close"
cmd-ctrl-alt-period = "reload-config"

# Launchers. Each one has to open a *new window* in the app already running, and each app exposes a
# different way to ask for that - `open -n` is never it, since it forks a second instance with its
# own Dock icon.
#   ghostty : AppleScript. `macos-applescript` defaults to true and Ghostty.sdef declares a
#             `new window` command, so this is real IPC into the running process. The pgrep guard
#             is there because quit-after-last-window-closed means Ghostty is often *not* running,
#             and a bare `tell` would launch it - giving the startup window plus a second one.
#             `ghostty +new-window` is Linux-only and answers "not supported on this platform".
#   chrome  : SingletonLock makes the second process hand --new-window to the running one and exit.
#   zed     : `zed --new` is Zed's own CLI over IPC; /opt/homebrew/bin is on aerospace's exec PATH.
cmd-ctrl-alt-enter = """exec-and-forget pgrep -qx ghostty \
  && osascript -e 'tell application "Ghostty" to new window' \
  || open -a Ghostty"""
cmd-ctrl-alt-b = "exec-and-forget open -na 'Google Chrome' --args --new-window"
cmd-ctrl-alt-z = "exec-and-forget zed --new"

# Launcher (Spotlight)
cmd-ctrl-alt-space = "exec-and-forget osascript -e 'tell application \"System Events\" to key code 49 using command down'"

# =============================================================================
# Resize mode - the only mode, mirroring sway's
# =============================================================================

[mode.resize.binding]
# smart picks the axis from the container's orientation, 100px steps like sway's
h = "resize smart -100"
j = "resize smart -100"
k = "resize smart +100"
l = "resize smart +100"
0 = "balance-sizes"

esc = "mode main"
enter = "mode main"
